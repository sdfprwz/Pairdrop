services:
  - type: web
    name: pairdrop-clone
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: override defaults without code changes
      # - key: STUN_URLS
      #   value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      # For reliable internet P2P (different networks / strict NAT), add a TURN server.
      # Without TURN, cross-network transfers fall back to server relay (labelled in UI).
      # Free options: Metered.ca free tier, Cloudflare Calls TURN, or self-hosted coturn.
      # - key: TURN_URLS
      #   value: turn:your-turn-host:3478
      # - key: TURN_USERNAME
      #   sync: false
      # - key: TURN_CREDENTIAL
      #   sync: false
      # Or dynamic coturn credentials:
      # - key: TURN_SECRET
      #   sync: false
      # Salt for hashing client IPs into same-network room IDs (privacy: IPs never stored):
      # - key: NET_SALT
      #   sync: false
